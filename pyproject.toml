[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ceap"
version = "0.1.0"
description = "CEAP PMT Afterpulse 随机耦合本底评估模拟框架"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "scipy>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
